<!-- =========================================================

     3 Inputs:
       1. Loan Amount
       2. Interest Rate
       3. Loan Term
     ========================================================= -->

      margin: 20px auto;

      color: #222;

      font-size: 26px;

    }

    #mortgageCalculator label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    #mortgageCalculator input,
    #mortgageCalculator select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
    }

    #mortgageCalculator button {
      display: block;
      width: 100%;
      margin: 20px 0;
      padding: 12px;
      border: 0;
      border-radius: 5px;
      background: #2d92b3;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #mortgageCalculator button:hover {
      opacity: 0.9;
    }

    #mortgageCalculator .payment-result {
      text-align: center;
      margin: 22px 0;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f7f7f7;
    }

    #mortgageCalculator .payment-label {
      font-size: 15px;
      margin-bottom: 5px;
    }

    #mortgageCalculator .payment-value {
      font-size: 30px;
      font-weight: 700;
    }

    #mortgageCalculator .schedule-title {
      margin: 28px 0 10px;
      font-size: 21px;
    }

    #mortgageCalculator .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #ddd;
    }

    #mortgageCalculator table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    #mortgageCalculator th,
    #mortgageCalculator td {
      padding: 9px 10px;
      border-bottom: 1px solid #ddd;
      text-align: right;
      white-space: nowrap;
    }

    #mortgageCalculator th {
      background: #f0f0f0;
      font-weight: 700;
    }

    #mortgageCalculator th:first-child,
    #mortgageCalculator td:first-child {
      text-align: center;
    }

    #mortgageCalculator .error {
      display: none;
      margin-top: 8px;
      color: #c92c2c;
      font-size: 14px;
    }
  </style>

  <!-- Loan Term -->

  <!-- Amortization Schedule -->
  <h3 class="schedule-title">Amortization Schedule</h3>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Payment</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Loan Balance</th>
        </tr>
      </thead>

      <tbody id="mcScheduleBody">
        <tr>
          <td colspan="4" style="text-align:center;">
            Enter a loan amount and select your assumptions.
          </td>
        </tr>
      </tbody>
    </table>
  </div>


  <script>
    (function () {

      const loanInput = document.getElementById("mcLoanAmount");
      const rateInput = document.getElementById("mcInterestRate");
      const termInput = document.getElementById("mcLoanTerm");
      const calculateButton = document.getElementById("mcCalculate");
      const paymentOutput = document.getElementById("mcMonthlyPayment");
      const scheduleBody = document.getElementById("mcScheduleBody");
      const errorOutput = document.getElementById("mcLoanError");


      function parseLoanAmount(value) {

        if (!value) return 0;

        // Remove currency symbols, commas, spaces, etc.
        const cleaned = value.replace(/[^0-9.]/g, "");
        const amount = parseFloat(cleaned);

        return isFinite(amount) ? amount : 0;
      }


      function money(value) {

        return value.toLocaleString("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      }


      function calculateMortgage() {

        const principal = parseLoanAmount(loanInput.value);
        const annualRate = parseFloat(rateInput.value);
        const numberOfPayments = parseInt(termInput.value, 10);

        errorOutput.style.display = "none";


        if (!principal || principal <= 0) {

          errorOutput.style.display = "block";
          paymentOutput.textContent = "$0.00";

          scheduleBody.innerHTML =
            '<tr>' +
            '<td colspan="4" style="text-align:center;">' +
            'Please enter a valid loan amount.' +
            '</td>' +
            '</tr>';

          return;
        }


        const monthlyRate = annualRate / 12;


        /*
         * Standard fixed-rate mortgage payment formula:
         *
         * M = P[r(1+r)^n] / [(1+r)^n - 1]
         *
         * Where:
         * P = principal
         * r = monthly interest rate
         * n = number of payments
         */

        let scheduledPayment;


        if (monthlyRate === 0) {

          scheduledPayment = principal / numberOfPayments;

        } else {

          const factor = Math.pow(
            1 + monthlyRate,
            numberOfPayments
          );

          scheduledPayment =
            principal *
            (
              monthlyRate * factor
            ) /
            (
              factor - 1
            );

        }


        // Display normal monthly payment rounded to cents.
        const displayedPayment =
          Math.round(scheduledPayment * 100) / 100;

        paymentOutput.textContent =
          money(displayedPayment);


        /*
         * Build amortization schedule.
         *
         * Calculations retain full precision internally.
         * The final payment is adjusted so the ending
         * balance reaches exactly $0.00.
         */

        let balance = principal;

        let rows = "";


        for (let paymentNumber = 1;
             paymentNumber <= numberOfPayments;
             paymentNumber++) {

          const interest =
            balance * monthlyRate;

          let principalPaid =
            scheduledPayment - interest;

          let actualPayment =
            scheduledPayment;


          /*
           * Final-payment protection.
           *
           * If the calculated principal would pay
           * more than the remaining balance, reduce
           * the final payment accordingly.
           */

          if (principalPaid > balance) {

            principalPaid = balance;
            actualPayment =
              principalPaid + interest;

          }


          balance -= principalPaid;


          // Prevent tiny floating-point residue.
          if (Math.abs(balance) < 0.005) {
            balance = 0;
          }


          rows +=
            "<tr>" +
              "<td>" + paymentNumber.toLocaleString("en-US") + "</td>" +
              "<td>" + money(principalPaid) + "</td>" +
              "<td>" + money(interest) + "</td>" +
              "<td>" + money(Math.max(balance, 0)) + "</td>" +
            "</tr>";


          if (balance <= 0) {
            break;
          }

        }


        scheduleBody.innerHTML = rows;

      }


      /*
       * Format the Loan Amount as currency when the
       * user leaves the field.
       */

      loanInput.addEventListener("blur", function () {

        const amount = parseLoanAmount(loanInput.value);

        if (amount > 0) {
          loanInput.value = money(amount);
        }

      });


      /*
       * Allow Enter key to calculate.
       */

      loanInput.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
          event.preventDefault();
          calculateMortgage();
        }

      });


      calculateButton.addEventListener(
        "click",
        calculateMortgage
      );


    })();
  </script>
