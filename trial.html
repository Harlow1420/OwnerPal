<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Price Estimator</title>

  <link rel="icon" href="https://ownerpal.com/ownerpal-favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .tile-link {
      display: block;
      width: 100%;
      max-width: 600px;
      text-decoration: none;
    }

    .tile-link img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
  </style>
</head>

<body>

  <a
    class="tile-link"
    href="https://ownerpal.com/index.html"
    target="_blank"
    rel="noopener noreferrer"
    title="Open Home Price Estimator"
  >
    <img
      src="https://ownerpal.com/ownerpal-tile.png"
      alt="Home Price Estimator"
    >
  </a>

</body>
</html>
