<head>

    <title>OwnerPal — Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand {
            color: #2d92b3;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .tagline {
            color: #666666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .navigation {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 30px;
        }

        .navigation a {
            display: inline-block;
            padding: 8px 14px;
            color: #2d92b3;
            text-decoration: none;
            border: 1px solid #2d92b3;
            border-radius: 6px;
            font-size: 14px;
        }

        .navigation a:hover {
            background: #2d92b3;
            color: #ffffff;
        }

        h1 {
            color: #2d92b3;
            font-size: 28px;
            margin: 0 0 32px;
            text-align: center;
        }

        h2 {
            color: #2d92b3;
            font-size: 20px;
            margin-top: 32px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #dddddd;
        }

        p {
            margin: 0 0 16px;
        }

        ul {
            margin: 8px 0 20px;
            padding-left: 25px;
        }

        li {
            margin-bottom: 8px;
        }

        .notice {
            margin: 0 0 28px;
            padding: 16px 18px;
            background: #f5f7f8;
            border-left: 4px solid #2d92b3;
        }

        .footer {
            margin-top: 45px;
            padding-top: 20px;
            border-top: 1px solid #dddddd;
            text-align: center;
            font-size: 14px;
            color: #777777;
        }

        .footer a {
            color: #2d92b3;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .page {
                padding: 22px 16px 40px;
            }

            .brand {
                font-size: 28px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 18px;
            }

            .navigation {
                gap: 6px;
            }

            .navigation a {
                padding: 7px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
